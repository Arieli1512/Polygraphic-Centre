services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: drobnyd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - drobnyd_postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  drobnyd_postgres_data:
