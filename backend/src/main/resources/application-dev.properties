spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/drobnyd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

firebase.admin.service-account-resource=${FIREBASE_SERVICE_ACCOUNT_RESOURCE:firebase-service-account.json}

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:change-me-in-dev}
app.auth.issuer=${APP_AUTH_ISSUER:polygraphic-centre}
app.auth.access-token-ttl-minutes=${APP_AUTH_ACCESS_TOKEN_TTL_MINUTES:15}
app.auth.refresh-token-ttl-days=${APP_AUTH_REFRESH_TOKEN_TTL_DAYS:7}
app.auth.cookie-path=/
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:None}
app.auth.cookie-domain=${APP_AUTH_COOKIE_DOMAIN:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,x-request-id,traceparent,tracestate,X-XSRF-TOKEN}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}

app.tracing.request-id-header=${APP_TRACING_REQUEST_ID_HEADER:x-request-id}
app.tracing.traceparent-header=${APP_TRACING_TRACEPARENT_HEADER:traceparent}
app.tracing.tracestate-header=${APP_TRACING_TRACESTATE_HEADER:tracestate}
app.tracing.request-id-mdc-key=${APP_TRACING_REQUEST_ID_MDC_KEY:requestId}
app.tracing.trace-id-mdc-key=${APP_TRACING_TRACE_ID_MDC_KEY:traceId}

gcs.project-id=${GCS_PROJECT_ID:}
gcs.bucket-name=${GCS_BUCKET_NAME:}
gcs.upload-root-prefix=${GCS_UPLOAD_ROOT_PREFIX:clients}
gcs.signed-url-ttl-minutes=${GCS_SIGNED_URL_TTL_MINUTES:15}
gcs.signing-service-account-email=${GCS_SIGNING_SERVICE_ACCOUNT_EMAIL:}

pubsub.project-id=${PUBSUB_PROJECT_ID:}
pubsub.order-events-topic-name=${PUBSUB_ORDER_EVENTS_TOPIC_NAME:order-events}
pubsub.notification-events-topic-name=${PUBSUB_NOTIFICATION_EVENTS_TOPIC_NAME:notification-events}
pubsub.storage-uploads-topic-name=${PUBSUB_STORAGE_UPLOADS_TOPIC_NAME:storage-uploads}
pubsub.enabled=${PUBSUB_ENABLED:false}
pubsub.require-oidc=${PUBSUB_REQUIRE_OIDC:false}
pubsub.webhook-audience=${PUBSUB_WEBHOOK_AUDIENCE:}

mail.enabled=${MAIL_ENABLED:false}
mail.from-address=${MAIL_FROM_ADDRESS:no-reply@polygraphic-centre.local}
mail.subject-prefix=${MAIL_SUBJECT_PREFIX:[Polygraphic Centre]}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

logging.level.root=INFO
logging.level.com.drobnyd.drobnyd=INFO